<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc">
  <title id="title">家電サポート文書検索デモの処理フロー</title>
  <desc id="desc">問い合わせを構造化した条件と検索文へ分け、filterした文書を全文検索とベクトル検索へ渡し、rerankまたは文脈復元を行う。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315d50"/></marker>
    <style>.box{fill:#fffdf6;stroke:#17211d;stroke-width:2}.accent{fill:#315d50}.label{font:600 20px sans-serif;fill:#17211d}.small{font:14px sans-serif;fill:#59645e}.white{fill:#fff}.line{stroke:#315d50;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="290" fill="#f3efe4"/>
  <rect class="box" x="25" y="103" width="150" height="84" rx="8"/><text class="label" x="100" y="137" text-anchor="middle">問い合わせ</text><text class="small" x="100" y="163" text-anchor="middle">条件と検索文を分ける</text>
  <path class="line" d="M175 145H225"/>
  <rect class="box" x="225" y="103" width="175" height="84" rx="8"/><text class="label" x="312" y="137" text-anchor="middle">Document filter</text><text class="small" x="312" y="163" text-anchor="middle">検索対象を先に限定</text>
  <path class="line" d="M400 145H445V75H490"/><path class="line" d="M445 145V215H490"/>
  <rect class="box" x="490" y="33" width="170" height="84" rx="8"/><text class="label" x="575" y="68" text-anchor="middle">Full-text</text><text class="small" x="575" y="93" text-anchor="middle">BM25による語の一致</text>
  <rect class="box" x="490" y="173" width="170" height="84" rx="8"/><text class="label" x="575" y="208" text-anchor="middle">Vector</text><text class="small" x="575" y="233" text-anchor="middle">意味の近さ</text>
  <path class="line" d="M660 75H705V145H750"/><path class="line" d="M660 215H705V145"/>
  <rect class="accent" x="750" y="103" width="145" height="84" rx="8"/><text class="label white" x="822" y="138" text-anchor="middle">Hybrid</text><text class="small white" x="822" y="163" text-anchor="middle">正規化して統合</text>
  <path class="line" d="M895 145H930"/>
  <rect class="box" x="930" y="103" width="145" height="84" rx="8"/><text class="label" x="1002" y="137" text-anchor="middle">後段処理</text><text class="small" x="1002" y="163" text-anchor="middle">Rerank / Context</text>
</svg>
