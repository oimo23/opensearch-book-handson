services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: search-quality-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - search-quality-opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: search-quality-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: search-quality-app
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-fin-doc-search-demo-v3}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-cl-nagoya/ruri-v3-310m}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-18b60fb8c2b9df296fb4212bb7d23ef94e579cd3}
      RERANK_MODEL_NAME: ${RERANK_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      RERANK_MODEL_REVISION: ${RERANK_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      ENABLE_RERANK: ${ENABLE_RERANK:-true}
      TOP_K: ${TOP_K:-5}
      CANDIDATE_SIZE: ${CANDIDATE_SIZE:-10}
      HYBRID_KEYWORD_WEIGHT: ${HYBRID_KEYWORD_WEIGHT:-0.5}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-0.5}
      HF_HOME: /models/huggingface
    ports:
      - "8100:8000"
    volumes:
      - huggingface-cache:/models/huggingface
    restart: unless-stopped

volumes:
  search-quality-opensearch-data:
  huggingface-cache:
