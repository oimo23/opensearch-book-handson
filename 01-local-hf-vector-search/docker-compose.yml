services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: hf-vector-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    container_name: hf-vector-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    container_name: hf-vector-loader
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-wiki-ja-demo}
      HF_DATASET: ${HF_DATASET:-Cohere/wikipedia-2023-11-embed-multilingual-v3}
      HF_CONFIG: ${HF_CONFIG:-ja}
      HF_SPLIT: ${HF_SPLIT:-train}
      MAX_DOCS: ${MAX_DOCS:-10000}
      BULK_SIZE: ${BULK_SIZE:-200}
      EXAMPLES_PATH: /app/generated/example_queries.md
      EXAMPLES_JSON_PATH: /app/generated/example_queries.json
      SAMPLE_QUERY_EMBEDDING_MODE: ${SAMPLE_QUERY_EMBEDDING_MODE:-heuristic}
      BEDROCK_EMBED_MODEL_ID: ${BEDROCK_EMBED_MODEL_ID:-cohere.embed-multilingual-v3}
      BEDROCK_EMBED_REGION: ${BEDROCK_EMBED_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./generated:/app/generated
    restart: "no"

volumes:
  opensearch-data:
